[package]
name = "openstage-presenter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The engine host of the OpenStage Presenter add-on: the program OpenStage Author talks to in JSON messages."
authors = ["OpenStage Author contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Reads how much memory the computer has, for the hardware check. MIT or Apache 2.0.
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
codegen-units = 1
