[package]
name = "openstage-presenter"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "The engine host of the OpenStage Presenter add-on: the program OpenStage Author talks to in JSON messages."
authors = ["OpenStage Author contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Reads the graphics cards (DXGI), the memory, the free disk space and whether the NVIDIA driver's CUDA library is there, for the hardware check. MIT or Apache 2.0;
# the same crate and version the recorder uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
codegen-units = 1
