<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
  <title id="t">Channel richness ladder</title>
  <desc id="d">Four bars rise from left to right: email, chat, phone or video call, and face to face. Face to face is the richest channel.</desc>
  <rect width="1000" height="500" fill="#f3f9fd"/>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="70" y="320" width="200" height="110" rx="8" fill="#0b5c8e"/>
    <text x="170" y="365" font-size="28" fill="#ffffff">Email</text>
    <text x="170" y="398" font-size="18" font-weight="400" fill="#ffffff">written, slower</text>

    <rect x="290" y="240" width="200" height="190" rx="8" fill="#0a4d79"/>
    <text x="390" y="290" font-size="28" fill="#ffffff">Chat</text>
    <text x="390" y="323" font-size="18" font-weight="400" fill="#ffffff">written, fast</text>

    <rect x="510" y="160" width="200" height="270" rx="8" fill="#0b3f66"/>
    <text x="610" y="206" font-size="26" fill="#ffffff">Phone or</text>
    <text x="610" y="238" font-size="26" fill="#ffffff">video call</text>
    <text x="610" y="274" font-size="18" font-weight="400" fill="#ffffff">voice, fast feedback</text>

    <rect x="730" y="80" width="200" height="350" rx="8" fill="#0b3a5a"/>
    <text x="830" y="130" font-size="28" fill="#ffffff">Face to face</text>
    <text x="830" y="166" font-size="18" font-weight="400" fill="#ffffff">tone, expression,</text>
    <text x="830" y="190" font-size="18" font-weight="400" fill="#ffffff">instant feedback</text>

    <line x1="60" y1="452" x2="935" y2="452" stroke="#36506a" stroke-width="3"/>
    <path d="M935 442 L958 452 L935 462 Z" fill="#36506a"/>
    <text x="60" y="486" font-size="22" fill="#36506a" text-anchor="start">Leaner</text>
    <text x="958" y="486" font-size="22" fill="#36506a" text-anchor="end">Richer</text>
  </g>
</svg>
